<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nidatlas — Birds of the Iberian Peninsula</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <div class="brand-row">
        <h1 class="wordmark"><a href="/">Nidatlas</a></h1>
        <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_switch_aria">
          <button type="button" class="lang-btn" data-lang="pt">PT</button>
          <button type="button" class="lang-btn" data-lang="es">ES</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <input
        type="search"
        id="search-box"
        class="search-box"
        data-i18n-placeholder="common.search_placeholder"
        data-i18n-aria-label="common.search_aria"
        autocomplete="off"
      >
    </div>
    <nav class="top-nav" role="group" data-i18n-aria-label="nav.primary_aria">
      <a href="/" class="top-nav-link" data-i18n="nav.map">Map</a>
      <a href="/atlas" class="top-nav-link active" data-i18n="nav.atlas">Atlas</a>
    </nav>
    <nav id="quick-nav" class="quick-nav" data-i18n-aria-label="nav.jump_to_order_aria"></nav>
  </header>
  <main>
    <h2 class="page-title" data-i18n="atlas.page_title">Atlas</h2>
    <p id="status" class="status" aria-live="polite" data-i18n="common.loading_species">Loading species…</p>
    <div id="species-list" class="species-list"></div>
  </main>

  <footer class="site-footer">
    <p id="footer-data-line"></p>
    <p id="footer-attribution-line"></p>
  </footer>

  <script src="lang.js"></script>
  <script src="app.js"></script>
</body>
</html>
