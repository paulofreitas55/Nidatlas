<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Species — Nidatlas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="species.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
    crossorigin=""
  >
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <div class="brand-row">
        <h1 class="wordmark"><a href="/">Nidatlas</a></h1>
        <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_switch_aria">
          <button type="button" class="lang-btn" data-lang="pt">PT</button>
          <button type="button" class="lang-btn" data-lang="es">ES</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <a class="back-link" href="/" data-i18n="nav.back_to_atlas">&larr; Back to Atlas</a>
    </div>
    <nav class="top-nav" role="group" data-i18n-aria-label="nav.primary_aria">
      <a href="/" class="top-nav-link active" data-i18n="nav.atlas">Atlas</a>
      <a href="/map" class="top-nav-link" data-i18n="nav.map">Map</a>
      <a href="/tree" class="top-nav-link" data-i18n="nav.tree">Tree</a>
      <a href="/rank" class="top-nav-link" data-i18n="nav.rank">Rank</a>
      <a href="/identify" class="top-nav-link nav-identify-link" data-i18n="nav.identify" hidden>Identify</a>
    </nav>
  </header>

  <main id="species-main" class="species-main">
    <p id="load-status" class="status" aria-live="polite" data-i18n="common.loading_species">Loading species…</p>

    <section id="identity" class="identity" hidden>
      <div id="species-photo-wrap" class="species-photo-wrap"></div>
      <div class="identity-text">
        <span id="dex-number" class="dex-number"></span>
        <h1 id="species-name" class="species-name"></h1>
        <p id="species-vernacular" class="species-vernacular"></p>
        <p id="species-taxon" class="species-taxon"></p>
      </div>
    </section>

    <section id="key-figures" class="key-figures" hidden>
      <div class="figure">
        <span id="total-records" class="figure-value"></span>
        <span class="figure-label" data-i18n="species.total_records_label">Total records</span>
      </div>
      <div class="figure">
        <span id="global-rank" class="figure-value"></span>
        <span class="figure-label" data-i18n="species.global_rank_label">Global rank</span>
      </div>
      <p id="commonness" class="commonness"></p>
    </section>

    <section id="seasonality" class="seasonality" hidden>
      <h2 class="section-title" data-i18n="species.seasonality_title">Seasonality</h2>
      <div id="monthly-chart" class="monthly-chart"></div>
    </section>

    <section id="distribution" class="distribution" hidden>
      <h2 class="section-title" data-i18n="species.distribution_title">Distribution</h2>
      <div id="month-filter" class="month-filter" role="group" data-i18n-aria-label="nav.filter_by_month_aria"></div>
      <div id="region-selector" class="region-selector" role="group" data-i18n-aria-label="nav.jump_to_region_aria"></div>
      <div id="map-panels" class="map-panels"></div>
      <p id="map-status" class="map-status" aria-live="polite"></p>
    </section>

    <section id="phylogeny" class="phylogeny" hidden>
      <h2 class="section-title" data-i18n="species.phylo_title">Position in the tree of life</h2>
      <p id="phylo-status" class="map-status" aria-live="polite"></p>
      <div id="phylo-canvas" class="cladogram-canvas" hidden></div>
      <a id="phylo-open-tree-link" class="phylo-open-tree-link" hidden data-i18n="species.phylo_open_full_tree">Open in full tree →</a>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-data-line"></p>
    <p id="footer-attribution-line"></p>
    <p id="footer-meta-line"></p>
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
    crossorigin=""
  ></script>
  <script src="lang.js"></script>
  <script src="common.js"></script>
  <script src="cladogram.js"></script>
  <script src="species.js"></script>
</body>
</html>
