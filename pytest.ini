markers =
    requires_full_dataset: needs the real, GBIF-derived data/nidatlas.db (real species/region/phylogeny content), not just its schema. Skipped in CI (which only has a schema-only fixture DB, see scripts/build_fixture_db.py) -- run the full suite locally against the real database before merging any change that touches query logic. See CLAUDE.md's CI section.
